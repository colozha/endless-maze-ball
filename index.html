<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Ball</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <section id="homePage" class="page page-active">
      <div class="card home-card">
        <p class="eyebrow">Endless Maze Challenge</p>
        <h1>Maze Ball</h1>
        <p class="description">
          Move the ball through a random maze, avoid the spikes, and reach the Finish to level up.
        </p>
        <div class="score-box">
          <span>High Score</span>
          <strong id="homeHighScore">0</strong>
        </div>
        <div class="difficulty-select" aria-label="Difficulty">
          <button class="difficulty-option is-active" type="button" data-difficulty="easy">Easy</button>
          <button class="difficulty-option" type="button" data-difficulty="hard">Hard</button>
        </div>
        <button id="continueButton" class="secondary-button continue-button">Continue Level</button>
        <button id="startButton" class="primary-button">Start Game</button>
      </div>
    </section>

    <section id="gamePage" class="page">
      <div class="game-frame">
        <div class="hud">
          <div class="hud-item hud-level" aria-label="Level">
            <span class="hud-icon icon-level" aria-hidden="true"></span>
            <strong id="levelText">1</strong>
          </div>
          <div class="hud-item hud-lives" aria-label="Lives">
            <span class="hud-icon icon-lives" aria-hidden="true"></span>
            <strong id="livesText">5</strong>
          </div>
          <div class="hud-item hud-high" aria-label="High score">
            <span class="hud-icon icon-high" aria-hidden="true"></span>
            <strong id="gameHighScore">0</strong>
          </div>
          <div class="hud-item difficulty-flag" aria-label="Difficulty mode">
            <span class="hud-icon icon-mode" aria-hidden="true"></span>
            <strong id="difficultyText">Easy</strong>
          </div>
          <button id="controlsToggle" class="control-toggle" type="button" aria-label="Hide directional controls" aria-pressed="true">
            <strong id="controlsToggleIcon" class="joystick-toggle-icon" aria-hidden="true"></strong>
          </button>
        </div>

        <div id="canvasWrap" class="canvas-wrap maze-panel">
          <canvas id="gameCanvas" aria-label="Maze Ball game canvas"></canvas>

          <div class="controls" aria-label="Directional controls">
            <div class="joystick-base">
              <button class="control-button control-up" data-direction="up" aria-label="Up"></button>
              <button class="control-button control-left" data-direction="left" aria-label="Left"></button>
              <button class="control-button control-down" data-direction="down" aria-label="Down"></button>
              <button class="control-button control-right" data-direction="right" aria-label="Right"></button>
              <div class="joystick-ring"></div>
              <div class="joystick-knob"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="endPage" class="page">
      <div class="card end-card">
        <p class="eyebrow">Game Over</p>
        <h2>Game Over</h2>
        <div class="result-grid">
          <div>
            <span>Last Level</span>
            <strong id="finalLevelText">1</strong>
          </div>
          <div>
            <span>High Score</span>
            <strong id="endHighScore">0</strong>
          </div>
        </div>
        <button id="playAgainButton" class="primary-button">Play Again</button>
        <button id="backHomeButton" class="secondary-button">Back to Home</button>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
